name: Build SmartPrice APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartPrice-Android-Project.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q SmartPrice-Android-Project.zip -d project

      - name: Build APK
        run: gradle -p project/SmartPrice assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPrice-APK
          path: project/SmartPrice/app/build/outputs/apk/debug/app-debug.apk
